<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Casino Bot Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: #fff;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 40px;
            padding: 20px;
            background: rgba(255, 215, 0, 0.1);
            border-radius: 10px;
            border: 2px solid #FFD700;
        }

        header h1 {
            font-size: 2.5em;
            color: #FFD700;
            margin-bottom: 10px;
        }

        .nav-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        .nav-tabs button {
            padding: 12px 24px;
            background: rgba(255, 215, 0, 0.1);
            border: 2px solid #FFD700;
            color: #FFD700;
            cursor: pointer;
            border-radius: 5px;
            font-size: 1em;
            transition: all 0.3s;
        }

        .nav-tabs button.active {
            background: #FFD700;
            color: #1a1a2e;
            font-weight: bold;
        }

        .nav-tabs button:hover {
            background: rgba(255, 215, 0, 0.2);
        }

        .tab-content {
            display: none;
            animation: fadeIn 0.3s;
        }

        .tab-content.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .section {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 215, 0, 0.3);
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .section h2 {
            color: #FFD700;
            margin-bottom: 20px;
            border-bottom: 2px solid #FFD700;
            padding-bottom: 10px;
        }

        .setting-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #ddd;
            font-weight: 500;
        }

        input, select, textarea {
            width: 100%;
            padding: 10px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid #FFD700;
            border-radius: 5px;
            color: #fff;
            font-size: 1em;
            transition: all 0.3s;
        }

        input:focus, select:focus, textarea:focus {
            outline: none;
            background: rgba(255, 215, 0, 0.1);
            border-color: #FFD700;
            box-shadow: 0 0 10px rgba(255, 215, 0, 0.3);
        }

        button {
            padding: 10px 20px;
            background: #FFD700;
            color: #1a1a2e;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            font-size: 1em;
            transition: all 0.3s;
        }

        button:hover {
            background: #FFC700;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(255, 215, 0, 0.4);
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }

        .stat-card {
            background: rgba(255, 215, 0, 0.1);
            border: 2px solid #FFD700;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
        }

        .stat-card h3 {
            color: #FFD700;
            margin-bottom: 10px;
        }

        .stat-card p {
            font-size: 1.5em;
            color: #fff;
        }

        .game-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
        }

        .game-card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 215, 0, 0.3);
            padding: 15px;
            border-radius: 8px;
        }

        .game-card h3 {
            color: #FFD700;
            margin-bottom: 15px;
            text-transform: uppercase;
        }

        .toggle {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 10px;
        }

        .toggle input[type="checkbox"] {
            width: auto;
            cursor: pointer;
        }

        .message {
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 20px;
            display: none;
            animation: slideIn 0.3s;
        }

        .message.success {
            background: rgba(0, 255, 136, 0.2);
            border: 1px solid #00FF88;
            color: #00FF88;
            display: block;
        }

        .message.error {
            background: rgba(255, 68, 68, 0.2);
            border: 1px solid #FF4444;
            color: #FF4444;
            display: block;
        }

        @keyframes slideIn {
            from {
                transform: translateY(-20px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .input-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        @media (max-width: 768px) {
            .input-group {
                grid-template-columns: 1fr;
            }
            
            header h1 {
                font-size: 1.8em;
            }
            
            .game-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🎰 Casino Bot Dashboard</h1>
            <p>Manage your bot settings and game configurations</p>
        </header>

        <div class="message" id="message"></div>

        <div class="nav-tabs">
            <button class="tab-btn active" data-tab="general">General Settings</button>
            <button class="tab-btn" data-tab="channels">Channels</button>
            <button class="tab-btn" data-tab="games">Game Settings</button>
            <button class="tab-btn" data-tab="stats">Statistics</button>
        </div>

        <!-- General Settings Tab -->
        <div id="general" class="tab-content active">
            <div class="section">
                <h2>⚙️ General Settings</h2>
                
                <div class="setting-group">
                    <label for="dailyEnabled">
                        <input type="checkbox" id="dailyEnabled"> Enable Daily Rewards
                    </label>
                </div>

                <div class="setting-group">
                    <label for="dailyAmount">Daily Reward Amount:</label>
                    <input type="number" id="dailyAmount" placeholder="e.g., 1000">
                </div>

                <div class="setting-group">
                    <label for="adminRole">Admin Role ID:</label>
                    <input type="text" id="adminRole" placeholder="Leave blank for no role restriction">
                </div>

                <button onclick="saveGeneralSettings()">Save Settings</button>
            </div>
        </div>

        <!-- Channels Tab -->
        <div id="channels" class="tab-content">
            <div class="section">
                <h2>📢 Channel Settings</h2>
                
                <div class="setting-group">
                    <label for="depositChannel">Deposit Channel ID:</label>
                    <input type="text" id="depositChannel" placeholder="Leave blank to disable">
                </div>

                <div class="setting-group">
                    <label for="withdrawChannel">Withdraw Channel ID:</label>
                    <input type="text" id="withdrawChannel" placeholder="Leave blank to disable">
                </div>

                <button onclick="saveChannelSettings()">Save Settings</button>
            </div>
        </div>

        <!-- Games Tab -->
        <div id="games" class="tab-content">
            <div class="section">
                <h2>🎮 Game Configuration</h2>
                <div class="game-grid" id="gamesList"></div>
            </div>
        </div>

        <!-- Stats Tab -->
        <div id="stats" class="tab-content">
            <div class="section">
                <h2>📊 Bot Statistics</h2>
                <div class="stats-grid" id="statsContainer"></div>
                <h2 style="margin-top: 30px;">Top 10 Users</h2>
                <div id="topUsers"></div>
            </div>
        </div>
    </div>

    <script>
        // Tab switching
        document.querySelectorAll('.tab-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                const tab = btn.dataset.tab;
                document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
                document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
                document.getElementById(tab).classList.add('active');
                btn.classList.add('active');
                
                if (tab === 'games') loadGames();
                if (tab === 'stats') loadStats();
            });
        });

        // Show message
        function showMessage(text, type = 'success') {
            const msg = document.getElementById('message');
            msg.textContent = text;
            msg.className = `message ${type}`;
            setTimeout(() => msg.className = 'message', 5000);
        }

        // Load settings
        async function loadSettings() {
            try {
                const res = await fetch('/api/settings');
                const data = await res.json();
                
                document.getElementById('dailyEnabled').checked = data.settings.dailyEnabled;
                document.getElementById('adminRole').value = data.settings.adminRoleId || '';
                document.getElementById('depositChannel').value = data.settings.depositChannel || '';
                document.getElementById('withdrawChannel').value = data.settings.withdrawChannel || '';
            } catch (error) {
                console.error('Error loading settings:', error);
            }
        }

        // Save general settings
        async function saveGeneralSettings() {
            try {
                const res = await fetch('/api/settings/general', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        dailyEnabled: document.getElementById('dailyEnabled').checked,
                        dailyAmount: parseInt(document.getElementById('dailyAmount').value) || 1000
                    })
                });
                
                if (res.ok) {
                    showMessage('✅ Settings saved successfully!', 'success');
                } else {
                    showMessage('❌ Failed to save settings', 'error');
                }
            } catch (error) {
                showMessage('❌ Error saving settings', 'error');
            }
        }

        // Save channel settings
        async function saveChannelSettings() {
            try {
                const res = await fetch('/api/settings/channels', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        depositChannel: document.getElementById('depositChannel').value || null,
                        withdrawChannel: document.getElementById('withdrawChannel').value || null
                    })
                });
                
                if (res.ok) {
                    showMessage('✅ Channels saved successfully!', 'success');
                } else {
                    showMessage('❌ Failed to save channels', 'error');
                }
            } catch (error) {
                showMessage('❌ Error saving channels', 'error');
            }
        }

        // Load and display games
        async function loadGames() {
            try {
                const res = await fetch('/api/settings');
                const data = await res.json();
                const gamesList = document.getElementById('gamesList');
                gamesList.innerHTML = '';
                
                for (const [gameName, settings] of Object.entries(data.gameSettings)) {
                    const card = document.createElement('div');
                    card.className = 'game-card';
                    card.innerHTML = `
                        <h3>${gameName}</h3>
                        <div class="toggle">
                            <input type="checkbox" ${settings.enabled ? 'checked' : ''} onchange="updateGame('${gameName}')">
                            <label>Enabled</label>
                        </div>
                        <div style="margin-bottom: 10px;">
                            <label>Min Bet:</label>
                            <input type="number" value="${settings.minBet}" onchange="updateGame('${gameName}')">
                        </div>
                        <div style="margin-bottom: 10px;">
                            <label>Max Bet:</label>
                            <input type="number" value="${settings.maxBet}" onchange="updateGame('${gameName}')">
                        </div>
                        <div style="margin-bottom: 10px;">
                            <label>RTP (${(settings.rtp * 100).toFixed(0)}%):</label>
                            <input type="range" min="0.8" max="0.99" step="0.01" value="${settings.rtp}" style="width: 100%;">
                        </div>
                    `;
                    gamesList.appendChild(card);
                }
            } catch (error) {
                console.error('Error loading games:', error);
            }
        }

        async function updateGame(gameName) {
            showMessage('✅ Game settings updated!', 'success');
        }

        // Load statistics
        async function loadStats() {
            try {
                const [statsRes, usersRes] = await Promise.all([
                    fetch('/api/stats'),
                    fetch('/api/top-users')
                ]);
                
                const stats = await statsRes.json();
                const topUsers = await usersRes.json();
                
                const statsContainer = document.getElementById('statsContainer');
                statsContainer.innerHTML = `
                    <div class="stat-card">
                        <h3>Total Users</h3>
                        <p>${stats.totalUsers || 0}</p>
                    </div>
                    <div class="stat-card">
                        <h3>Total Games Played</h3>
                        <p>${(stats.totalGames || 0).toLocaleString()}</p>
                    </div>
                    <div class="stat-card">
                        <h3>House Profit</h3>
                        <p>${(stats.houseProfit || 0).toLocaleString()} 💎</p>
                    </div>
                    <div class="stat-card">
                        <h3>Win Rate</h3>
                        <p>${stats.totalGames ? ((stats.totalWins / stats.totalGames * 100).toFixed(1)) : 0}%</p>
                    </div>
                `;
                
                const topUsersDiv = document.getElementById('topUsers');
                let html = '<table style="width: 100%; border-collapse: collapse;">';
                html += '<tr style="border-bottom: 2px solid #FFD700;"><th style="text-align: left; padding: 10px;">User</th><th style="text-align: right; padding: 10px;">Balance</th><th style="text-align: right; padding: 10px;">Wins</th></tr>';
                
                topUsers.forEach((user, idx) => {
                    html += `<tr style="border-bottom: 1px solid rgba(255,215,0,0.2);">
                        <td style="padding: 10px;">#${idx + 1} ${user.username}</td>
                        <td style="text-align: right; padding: 10px;">${user.balance.toLocaleString()} 💎</td>
                        <td style="text-align: right; padding: 10px;">${user.wins}</td>
                    </tr>`;
                });
                
                html += '</table>';
                topUsersDiv.innerHTML = html;
            } catch (error) {
                console.error('Error loading stats:', error);
                showMessage('Error loading statistics', 'error');
            }
        }

        // Initial load
        loadSettings();
    </script>
</body>
</html>
